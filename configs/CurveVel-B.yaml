  scale_m_s: 1500.0
model:
  model_type: DhariwalUNet
  img_resolution: 70
  img_channels: 1
  label_dim: 0
  model_channels: 64
  channel_mult:
  - 1
  - 2
  - 3
  - 4
  channel_mult_emb: 4
  num_blocks: 2
  attn_resolutions:
  - 36
  - 18
  - 9
  dropout: 0.0
  label_dropout: 0.0
  sigma_min: 0.002
  sigma_max: 80.0
  sigma_data: 0.5
  use_fp16: true
edm_loss:
  p_mean: -1.2
  p_std: 1.2
  sigma_data: 0.5
training:
  total_steps: 400000
  batch_size: 32
  num_workers: 4
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0
  warmup_steps: 500
  grad_clip: 1.0
  mixed_precision: fp16
  ema_halflife_nimg: 204800
  ema_rampup_ratio: 0.05
  log_every: 100
  validation_every: 5000
  validation_max_batches: 20
  save_every: 50000
  resume: null
output:
  root: outputs/training
  run_name: CurveVel-B
